<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ 'assets/css/main.css' | relative_url }}">
</head>
<body>
    <main class="container">
        <header class="site-header">
            <img src="{{ site.avatar }}" alt="{{ site.title }}" class="avatar">
            <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
        </header>

        {{ content }}

        <footer class="site-footer">
            <div class="footer-links">
                <a href="https://github.com/axperty">GitHub</a>
                <a href="https://www.curseforge.com/members/axperty/projects">CurseForge</a>
                <a href="https://modrinth.com/user/Axperty">Modrinth</a>
            </div>
            <p class="copyright">Copyright 2026 Axperty. All Rights Reserved.</p>
        </footer>
    </main>
</body>
</html>

---
layout: default
---

<article class="post">
    <h2 class="post-title">{{ page.title }}</h2>
    <span class="post-meta">
        {{ page.date | date: "%B %-d, %Y" }}
        {% if page.category %}
            &bull; <a href="{{ '/categories.html#' | append: page.category | relative_url }}">{{ page.category }}</a>
        {% endif %}
    </span>
    <div class="post-content">
        {{ content }}
    </div>
</article>
